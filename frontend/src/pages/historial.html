<template id="page-history">
  <header class="page-heading">
    <h1 id="page-title" tabindex="-1">Historial de contenido</h1>
    <p>Biblioteca de contenidos, del más reciente al más antiguo.</p>
  </header>
  <form id="library-form" class="section">
    <h2>Buscar y filtrar</h2>
    <div class="field"><label for="search">Buscar por producto, texto u objetivo</label><input id="search" name="search" type="search" placeholder="Buscar contenido"></div>
    <div class="field"><label for="filter-type">Formato</label><select id="filter-type" name="type"><option value="">Todos los formatos</option></select></div>
    <div class="field"><label for="filter-status">Estado editorial</label><select id="filter-status" name="status"><option value="">Todos los estados</option></select></div>
    <div class="field"><label for="filter-campaign">Campaña</label><select id="filter-campaign" name="campaign"><option value="">Todas las campañas</option></select></div>
    <div class="actions"><button type="submit" class="button">Aplicar filtros</button><a class="button" href="#/historial">Limpiar filtros</a></div>
  </form>
  <p class="help" data-bind="count"></p>
  <section class="section">
    <h2>Contenidos</h2>
    <div class="empty" data-state="empty">
      <h3 data-bind="emptyTitle">Todavía no tienes contenido guardado</h3>
      <p data-bind="emptyDescription">Genera tu primer contenido para consultarlo aquí.</p>
    </div>
    <div class="stack" data-list="contents"></div>
  </section>
  <a class="button primary" href="#/generar">Generar contenido</a>
</template>
