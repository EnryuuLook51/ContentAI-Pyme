<template id="page-company">
  <header class="page-heading">
    <h1 id="page-title" tabindex="-1">Mi empresa</h1>
    <p>Guarda el contexto que utilizará la IA para redactar.</p>
  </header>
  <p class="help">* Campos obligatorios. Los cambios se guardan en la base de datos.</p>
  <form id="company-form" novalidate>
    <section class="section">
      <h2>Empresa</h2>
      <div class="field">
        <label for="name">Nombre comercial <span aria-hidden="true">*</span></label>
        <input id="name" name="name" placeholder="Nombre del negocio" required aria-describedby="name-error">
        <small class="field-error" id="name-error" hidden></small>
      </div>
      <div class="field">
        <label for="activity">Actividad económica <span aria-hidden="true">*</span></label>
        <input id="activity" name="activity" placeholder="Actividad del negocio" required aria-describedby="activity-error">
        <small class="field-error" id="activity-error" hidden></small>
      </div>
      <div class="field">
        <div class="field-label-row">
          <label for="description">Descripción del negocio (opcional)</label>
          <button type="button" class="field-help-toggle" data-action="field-help" aria-label="Ayuda para escribir la descripción del negocio" aria-expanded="false" aria-controls="business-description-help"><span aria-hidden="true">!</span></button>
        </div>
        <div id="business-description-help" class="field-help-panel stack" hidden>
          <h3>¿Cómo describir tu negocio?</h3>
          <p>En 2 a 4 frases, explica qué ofreces, a quién ayudas y cómo trabaja tu negocio. Puedes mencionar qué te diferencia, siempre que sea información real.</p>
          <p class="help">Ejemplo ficticio: TecnoBarrio</p>
          <blockquote>Somos un negocio de mantenimiento de computadoras para pequeños comercios de la zona. Ofrecemos limpieza interna y revisión básica para ayudar a prevenir fallas por acumulación de polvo. Atendemos de forma cercana y profesional.</blockquote>
          <p class="help">Adáptalo a tu negocio. No incluyas precios, descuentos o garantías que no puedas confirmar.</p>
        </div>
        <textarea id="description" name="description" placeholder="Describe tu negocio" rows="3"></textarea>
      </div>
    </section>
    <section class="section">
      <h2>Público</h2>
      <div class="field">
        <label for="audienceName">Nombre identificador del público <span aria-hidden="true">*</span></label>
        <input id="audienceName" name="audienceName" placeholder="Nombre del público" required aria-describedby="audienceName-error">
        <small class="field-error" id="audienceName-error" hidden></small>
      </div>
      <div class="field">
        <label for="audience">Descripción del público objetivo <span aria-hidden="true">*</span></label>
        <textarea id="audience" name="audience" placeholder="A quién se dirige tu negocio" rows="3" required aria-describedby="audience-error"></textarea>
        <small class="field-error" id="audience-error" hidden></small>
      </div>
    </section>
    <section class="section">
      <h2>Marca</h2>
      <div class="field">
        <label for="tone">Tono de comunicación <span aria-hidden="true">*</span></label>
        <input id="tone" name="tone" placeholder="Cómo quieres comunicarte" required aria-describedby="tone-error">
        <small class="field-error" id="tone-error" hidden></small>
      </div>
      <div class="field">
        <label for="restrictions">Restricciones de comunicación (opcional)</label>
        <textarea id="restrictions" name="restrictions" placeholder="Afirmaciones que deben evitarse" rows="3"></textarea>
      </div>
    </section>
    <div class="actions">
      <button class="button primary" type="submit" name="intent" value="save">Guardar cambios</button>
      <button class="button" type="submit" name="intent" value="continue">Guardar y continuar</button>
      <button class="text-button" type="reset">Cancelar cambios</button>
    </div>
  </form>
</template>
