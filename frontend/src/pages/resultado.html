<template id="page-result">
  <header class="page-heading">
    <h1 id="page-title" tabindex="-1">Resultado de generación</h1>
    <p data-bind="description">Revisa el borrador y confirma que quedó guardado. · Paso 3 de 3: resultado.</p>
  </header>
  <section class="result-section">
    <h2>Resultado</h2>
    <dl><div><dt>Contexto de generación</dt><dd data-bind="context"></dd></div></dl>
    <div class="notice success" role="status" data-state="saved">Contenido de demostración guardado en tu historial</div>
    <div class="notice warning" role="status" data-state="pending" hidden>Guardado pendiente: no se pudo guardar en este navegador. El borrador sigue disponible en esta sesión.</div>
    <div data-component="reader"></div>
    <h2>Revisión</h2>
    <p>Revisa el texto antes de utilizarlo. La IA puede cometer errores.</p>
  </section>
  <div class="actions">
    <button type="button" class="button primary" data-action="copy">Copiar texto</button>
    <a class="button" data-link="detail">Ver contenido guardado</a>
    <button type="button" class="button" data-action="save-again" hidden>Volver a consultar estado</button>
    <a class="button" href="#/historial">Ir al historial</a>
    <a class="button" href="#/generar">Crear otro contenido</a>
  </div>
</template>

<template id="page-processing">
  <header class="page-heading">
    <h1 id="page-title" tabindex="-1">Resultado de generación</h1>
    <p>Solicitud recibida. Estamos preparando tu contenido. · Paso 2 de 3: generación.</p>
  </header>
  <div class="notice info" role="status">Procesando: estamos preparando tu contenido.</div>
  <p>Puedes consultar de nuevo el estado de la misma solicitud sin generar otra solicitud.</p>
  <div class="actions">
    <button type="button" class="button primary" data-action="check">Volver a consultar estado</button>
    <a class="button" href="#/historial">Ir al historial</a>
  </div>
</template>

<template id="page-generation-error">
  <header class="page-heading">
    <h1 id="page-title" tabindex="-1">Resultado de generación</h1>
    <p>No se pudo generar el contenido. No se guardó contenido.</p>
  </header>
  <div class="notice error" role="alert">Error de generación: inténtalo de nuevo cuando el servicio esté disponible.</div>
  <p>No hay un contenido generado disponible para esta solicitud.</p>
  <div class="actions">
    <button type="button" class="button primary" data-action="retry">Reintentar generación</button>
    <a class="button" href="#/generar">Volver al generador</a>
  </div>
</template>

<template id="page-no-result">
  <header class="page-heading">
    <h1 id="page-title" tabindex="-1">Resultado de generación</h1>
    <p>No hay un resultado disponible para esta solicitud.</p>
  </header>
  <div class="notice warning" role="status">Selecciona un producto o servicio y prepara un contenido.</div>
  <a class="button primary" href="#/generar">Volver al generador</a>
</template>
