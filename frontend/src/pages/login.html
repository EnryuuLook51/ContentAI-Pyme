<template id="page-login">
  <div class="auth-eyebrow"><span></span> CONTENTAI-PYME</div>
  <header class="page-heading">
    <h1 id="page-title" tabindex="-1">Iniciar sesión</h1>
    <p>Ingresa para guardar el contexto de tu negocio y preparar una publicación.</p>
  </header>
  <div class="notice warning" role="status" data-state="expired" hidden>Tu sesión ha expirado. Vuelve a iniciar sesión.</div>
  <form id="login-form" novalidate>
    <div class="field">
      <label for="email">Correo electrónico <span aria-hidden="true">*</span></label>
      <input id="email" name="email" type="email" placeholder="tu@negocio.com" autocomplete="username" autocapitalize="none" required aria-describedby="email-error">
      <small class="field-error" id="email-error" hidden></small>
    </div>
    <div class="field">
      <label for="password">Contraseña <span aria-hidden="true">*</span></label>
      <div class="auth-password">
        <input id="password" name="password" type="password" placeholder="Tu contraseña" autocomplete="current-password" required aria-describedby="password-error">
        <button class="auth-password-toggle" type="button" data-action="password" aria-label="Mostrar contraseña" aria-controls="password" aria-pressed="false">Mostrar</button>
      </div>
      <small class="field-error" id="password-error" hidden></small>
    </div>
    <button class="button primary auth-submit" type="submit">Iniciar sesión <span aria-hidden="true">↗</span></button>
    <div class="auth-demo">
      <span class="auth-demo-title">ACCESO DE DEMOSTRACIÓN</span>
      <p class="help">Cuenta ficticia: <strong>demo@contentai-pyme.local</strong><br>Contraseña: <strong>Demo2026!</strong></p>
    </div>
  </form>
</template>
