<template id="app-shell">
  <div class="app-shell">
    <aside id="navigation" class="sidebar" aria-label="Barra lateral">
      <a class="sidebar-brand" href="#/panel" aria-label="ContentAI-PYME · Ir al panel">
        <img src="./src/assets/logo-wordmark.svg" alt="ContentAI-PYME" width="280" height="190">
      </a>
      <p class="nav-label">ESPACIO DE TRABAJO</p>
      <nav class="sidebar-nav" aria-label="Navegación principal">
        <a href="#/panel" data-route="panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3Zm11 0h7v7h-7ZM3 14h7v7H3Zm11 0h7v7h-7Z"/></svg><span>Panel</span></a>
        <a href="#/generar" data-route="generar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></svg><span>Generar contenido</span></a>
        <a href="#/historial" data-route="historial"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4-9 4Z"/><path d="m3 12 9 4 9-4M3 17l9 4 9-4"/></svg><span>Historial</span></a>
        <a href="#/productos" data-route="productos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4v10l-9 4-9-4Z"/><path d="m3 7 9 4 9-4M12 11v10M7 5l9 4"/></svg><span>Productos y servicios</span></a>
        <a href="#/empresa" data-route="empresa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V3h14v18M3 21h18M9 7h1m4 0h1M9 11h1m4 0h1M10 21v-6h4v6"/></svg><span>Mi empresa</span></a>
        <a href="#/campanas" data-route="campanas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V4m0 0c5-4 11 4 16 0v11c-5 4-11-4-16 0"/></svg><span>Campañas y canales</span></a>
        <a href="#/resultados" data-route="resultados"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3v18h17M8 17v-4m5 4V9m5 8V5"/></svg><span>Resultados comerciales</span></a>
      </nav>
      <footer class="sidebar-footer">
        <div class="sidebar-company"><span class="company-avatar" aria-hidden="true">●</span><div><p data-bind="companyName"></p><p class="help">Espacio de demostración</p></div></div>
        <button class="sidebar-logout text-button" type="button" data-action="logout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v16h5m5-13 5 5-5 5m-6-5h11"/></svg>Salir</button>
      </footer>
    </aside>
    <header class="topbar">
      <a class="brand" href="#/panel"><img src="./src/assets/logo.svg" alt="" width="30" height="29"><span class="brand-name">ContentAI<span>—</span>PYME</span></a>
      <div class="account">
        <span data-bind="account"></span>
        <button class="text-button mobile-logout" data-action="logout">Salir</button>
      </div>
      <button class="menu-button button" aria-expanded="false" aria-controls="navigation" data-action="menu">Menú</button>
    </header>
    <div class="workspace">
      <main id="main" class="workarea"></main>
    </div>
  </div>
</template>

<template id="auth-shell">
  <div class="auth-shell">
    <div class="auth-scene" aria-hidden="true">
      <div class="auth-haze"></div>
      <div class="auth-orb"></div>
      <div class="auth-stars"></div>
    </div>
    <header class="auth-header">
      <a class="brand" href="#/login"><img src="./src/assets/logo.svg" alt="" width="30" height="29"><span class="brand-name">ContentAI<span>—</span>PYME</span></a>
      <span class="auth-prototype">Prototipo interactivo</span>
    </header>
    <div class="auth-layout"><main id="main" class="login-card"></main></div>
    <footer class="auth-footer">
      <p>Tu negocio. Tu voz. Nuevas posibilidades.</p>
      <button type="button" class="auth-motion-toggle" data-action="motion" aria-pressed="false">Pausar animación</button>
    </footer>
  </div>
</template>

<template id="context-panel">
  <aside class="context-panel" aria-label="Resumen del contexto">
    <h2>Resumen del contexto</h2>
    <p class="help">Datos de ejemplo</p>
    <p data-bind="company"></p>
    <p data-bind="product"></p>
    <p data-bind="benefits"></p>
    <p data-bind="audience"></p>
    <p data-bind="tone"></p>
    <p data-bind="restrictions"></p>
    <p data-bind="campaign"></p>
    <p data-bind="channel"></p>
    <p class="assurance">No se inventarán precios, descuentos ni garantías</p>
    <div class="stack">
      <a class="button" href="#/empresa">Editar negocio</a>
      <a class="button" href="#/productos">Añadir/editar producto o servicio</a>
    </div>
  </aside>
</template>

<template id="content-reader">
  <div class="content-reader">
    <p class="help">Resultado ilustrativo; no generado por IA · Datos de ejemplo</p>
    <p class="generated-text" id="generated-text" data-bind="text"></p>
  </div>
</template>

<template id="catalog-item">
  <article class="catalog-item">
    <dl>
      <div><dt data-bind="type"></dt><dd class="item-title"><span data-bind="name"></span> <span class="help">· Dato de ejemplo</span></dd></div>
      <div><dt>Qué incluye</dt><dd data-bind="features"></dd></div>
      <div><dt>Beneficios</dt><dd data-bind="benefits"></dd></div>
    </dl>
    <div class="actions">
      <a class="button" data-link="edit">Editar</a>
      <a class="button" data-link="generate">Generar contenido</a>
    </div>
  </article>
</template>

<template id="history-item">
  <article class="history-item">
    <div class="history-title"><h3 data-bind="title"></h3><span class="badge" data-bind="status">Borrador</span></div>
    <p class="help">Dato de ejemplo · <time data-bind="date"></time></p>
    <p data-bind="excerpt"></p>
    <p class="help" data-bind="campaign"></p>
    <a class="button" data-link="detail">Ver contenido</a>
  </article>
</template>

<template id="campaign-item">
  <article class="history-item">
    <h3 data-bind="name"></h3><p data-bind="goal"></p>
    <p class="help" data-bind="audience"></p><p class="help" data-bind="channels"></p>
    <div class="actions"><a class="button" data-link="edit">Editar campaña</a><a class="button" data-link="generate">Generar para esta campaña</a><a class="button" data-link="contents">Ver contenidos</a></div>
  </article>
</template>

<template id="version-item">
  <article class="history-item"><h3 data-bind="title"></h3><p class="help" data-bind="date"></p><p class="help" data-bind="source"></p><a class="button" data-link="version">Consultar versión</a></article>
</template>

<template id="observation-item">
  <article class="history-item">
    <h3 data-bind="content"></h3><p class="help" data-bind="date"></p>
    <dl><div><dt>Impresiones</dt><dd data-bind="impressions"></dd></div><div><dt>Clics</dt><dd data-bind="clicks"></dd></div><div><dt>Observaciones</dt><dd data-bind="notes"></dd></div></dl>
    <a class="button" data-link="detail">Ver contenido relacionado</a>
  </article>
</template>
