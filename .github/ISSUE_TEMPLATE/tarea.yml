name: Tarea de desarrollo
description: Trabajo concreto con responsable y criterio de aceptación
title: "[Tarea] "
body:
  - type: input
    id: responsable
    attributes:
      label: Responsable
      description: Nombre del integrante responsable
    validations:
      required: true
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo y alcance
      description: Qué debe implementar y qué queda fuera
    validations:
      required: true
  - type: textarea
    id: dependencias
    attributes:
      label: Dependencias y coordinación
      description: Rutas, tablas o entregas de otros integrantes
  - type: textarea
    id: aceptacion
    attributes:
      label: Criterios de aceptación
      description: Condiciones comprobables para marcar la tarea como terminada
    validations:
      required: true
  - type: input
    id: fecha
    attributes:
      label: Fecha límite interna
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia y pruebas
      description: Pasos reproducibles; no incluir secretos
